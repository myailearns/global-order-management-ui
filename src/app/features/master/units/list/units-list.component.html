<div class="units-list">
  <header class="units-list__header">
    <gom-page-heading [title]="text.pageTitle | translate" [iconClass]="headingIcon"></gom-page-heading>
    <gom-lib-button
      class="btn-add"
      type="button"
      variant="primary"
      [size]="isMobileHeader() ? 'compact-icon' : 'default'"
      (buttonClick)="onAddNew()"
      [gomDisableIfNoFeature]="'unit.create'"
      [disabled]="loading || !canCreate"
      [attr.aria-label]="text.addUnit | translate"
      [buttonTitle]="text.addUnit | translate"
    >
      <i class="ri-add-line" aria-hidden="true"></i>
      @if (!isMobileHeader()) {
        {{ text.addUnit | translate }}
      }
    </gom-lib-button>
  </header>

  <section class="units-list__table-shell">
    <gom-lib-table
      [columns]="columns"
      [rows]="rows"
      [loading]="loading"
      [dataMode]="dataMode"
      [totalItems]="totalItems"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [searchPlaceholder]="text.searchPlaceholder | translate"
      [emptyMessage]="text.emptyMessage | translate"
      [mobileCardView]="true"
      [mobileCardFields]="mobileCardFields"
      [mobileCardClickable]="true"
      (rowAction)="onRowAction($event)"
      (rowClick)="onRowClick($event)"
      (queryChange)="onTableQueryChange($event)"
    ></gom-lib-table>
  </section>
</div>
