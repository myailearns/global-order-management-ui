<section class="master-page">
  <header class="master-page__header">
    <gom-page-heading [title]="'fieldGroups.title' | translate" [iconClass]="headingIcon"></gom-page-heading>
    <gom-lib-button
      type="button"
      variant="primary"
      [size]="isMobileHeader() ? 'compact-icon' : 'default'"
      (buttonClick)="onAddFieldGroup()"
      [gomDisableIfNoFeature]="'fieldGroup.create'"
      [disabled]="loading() || !canCreateFieldGroup()"
      [attr.aria-label]="'fieldGroups.add' | translate"
      [buttonTitle]="'fieldGroups.add' | translate"
    >
      <i class="ri-add-line" aria-hidden="true"></i>
      @if (!isMobileHeader()) {
        {{ 'fieldGroups.add' | translate }}
      }
    </gom-lib-button>
  </header>

  @if (errorMessage()) {
    <div class="master-page__error">
      <div class="master-page__error-content">
        <i class="ri-alert-fill" aria-hidden="true"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    </div>
  }

  <article class="master-page__table-shell">
    <gom-lib-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [dataMode]="fieldGroupsTableDataMode()"
      [totalItems]="totalFieldGroups()"
      [pageIndex]="fieldGroupTablePageIndex()"
      [pageSize]="fieldGroupTablePageSize()"
      [pageSizeOptions]="serverSidePaginationFieldGroups() ? [50] : [10, 20, 50]"
      [searchPlaceholder]="'fieldGroups.search' | translate"
      [emptyMessage]="'fieldGroups.empty' | translate"
      [mobileCardView]="true"
      (rowAction)="onRowAction($event)"
      (queryChange)="onFieldGroupsTableQueryChange($event)"
    ></gom-lib-table>

    @if (serverSidePaginationFieldGroups() && canLoadAllFieldGroups() && !allFieldGroupsLoaded()) {
      <div class="pagination-controls">
        <div class="pagination-controls__info">
          {{ totalFieldGroups() }} field groups total. Use table pager for page navigation.
        </div>
        <div class="pagination-controls__actions">
          <gom-lib-button
            type="button"
            variant="secondary"
            [disabled]="loading()"
            (buttonClick)="loadAllFieldGroups()"
          ><i class="ri-download-2-line" aria-hidden="true"></i> Load All</gom-lib-button>
        </div>
      </div>
    }
  </article>
</section>

<gom-field-groups-form
  [isOpen]="formOpen()"
  [initialData]="selectedFieldGroup()"
  [fields]="fields()"
  [groups]="groups()"
  (formSubmit)="onFormSubmit($event)"
  (formCancel)="onFormCancel()"
></gom-field-groups-form>

<gom-lib-confirmation-modal
  [(show)]="deleteConfirmOpen"
  [title]="('fieldGroups.deleteConfirm.title' | translate)"
  [message]="getDeleteMessage()"
  [confirmText]="('common.actions.delete' | translate)"
  [cancelText]="('common.actions.cancel' | translate)"
  confirmVariant="danger"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
></gom-lib-confirmation-modal>
