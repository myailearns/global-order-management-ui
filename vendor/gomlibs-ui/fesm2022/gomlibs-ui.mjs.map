<ng-template #chipContent><ng-content></ng-content></ng-template>

@if (interactive) {
  <button
    type="button"
    [class]="'gom-chip gom-chip--interactive gom-chip--' + tone"
    [class.gom-chip--compact]="size === 'compact'"
    [class.gom-chip--dense]="size === 'dense'"
    [class.gom-chip--full-width]="fullWidth"
    [class.gom-chip--selected]="selected"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-selected]="ariaRole === 'tab' ? selected : null"
    [attr.aria-checked]="ariaRole === 'menuitemradio' ? selected : null"
    [attr.role]="ariaRole || null"
    (click)="handleClick($event)"
  >
    <ng-container [ngTemplateOutlet]="chipContent"></ng-container>
  </button>
} @else {
  <span
    class="gom-chip"
    [class]="'gom-chip gom-chip--' + tone"
    [class.gom-chip--compact]="size === 'compact'"
    [class.gom-chip--full-width]="fullWidth"
  >
    <ng-container [ngTemplateOutlet]="chipContent"></ng-container>
  </span>
}
