<section class="gom-accordion" [class.gom-accordion--expanded]="expanded" [class.gom-accordion--disabled]="disabled">
  <button
    type="button"
    class="gom-accordion__trigger"
    [attr.aria-expanded]="expanded"
    [disabled]="disabled"
    (click)="onTriggerClick()"
  >
    <div class="gom-accordion__header-content">
      <h3 class="gom-accordion__title">{{ title }}</h3>
      @if (subtitle) {
        <p class="gom-accordion__subtitle">{{ subtitle }}</p>
      }
    </div>
    <span class="gom-accordion__chevron" aria-hidden="true">
      <i class="ri-arrow-right-s-line"></i>
    </span>
  </button>

  @if (expanded) {
    <div class="gom-accordion__body">
      <ng-content></ng-content>
    </div>
  }
</section>
