@if (label) {
  <label class="gom-control__label" [for]="id">
    {{ label }}
    @if (required) {
      <span class="gom-control__required" aria-hidden="true">*</span>
    }
  </label>
}

<div class="gom-control__input-wrapper">
  @if (leadingIcon) {
    <i [class]="'gom-control__leading-icon ' + leadingIcon" aria-hidden="true"></i>
  }
  <input
    class="gom-control__field"
    [class.gom-control__field--with-leading-icon]="!!leadingIcon"
    [class.gom-control__field--clearable]="clearable && !!value"
    [id]="id"
    [type]="type"
    [value]="value"
    [attr.min]="min ?? null"
    [attr.max]="max ?? null"
    [attr.step]="step ?? null"
    [placeholder]="placeholder"
    [attr.inputmode]="inputmode ?? null"
    [disabled]="disabled"
    [attr.aria-invalid]="!!error"
    [attr.aria-label]="ariaLabel || null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  @if (clearable && value && !disabled) {
    <button class="gom-control__clear" type="button" aria-label="Clear input" (click)="clearValue()">
      <i class="ri-close-line" aria-hidden="true"></i>
    </button>
  }
  @if (error) {
    <div class="gom-control__icon">
      <i class="ri-alert-circle-line" aria-hidden="true"></i>
    </div>
  }
</div>

@if (error) {
  <p class="gom-control__message gom-control__message--error"><i class="ri-error-warning-line"></i> {{ error }}</p>
} @else if (hint) {
  <p class="gom-control__message"><i class="ri-information-line"></i> {{ hint }}</p>
}
