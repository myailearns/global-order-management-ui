<button
  class="gom-button"
  [class.gom-button--secondary]="variant === 'secondary'"
  [class.gom-button--danger]="variant === 'danger'"
  [class.gom-button--ghost]="variant === 'ghost'"
  [class.gom-button--icon]="size === 'icon'"
  [class.gom-button--compact-icon]="size === 'compact-icon'"
  [type]="type"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-expanded]="ariaExpanded"
  [attr.aria-haspopup]="ariaHaspopup"
  [attr.aria-current]="ariaCurrent"
  [attr.title]="buttonTitle || null"
  [attr.role]="ariaRole || null"
  (click)="handleClick($event)"
>
  <ng-content></ng-content>
</button>
